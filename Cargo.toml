[package]
name = "systemstd"
description = "A custom embedded terminal handler"
version = "6.0.0"
edition = "2024"
rust-version = "1.99"
categories = ["accessibility", "command-line-interface", "config", "filesystem", "rust-patterns"]
keywords = ["system", "io", "cli", "errors"]
repository = "https://github.com/alejandro-vaz/systemstd"
license = "MIT"
authors = ["Alejandro Vaz <alejandro.vaz.myt@gmail.com>"]

[lib]
path = "./lib.rs"

[[bench]]
name = "systemstd"
harness = false
path = "benches.rs"

[[test]]
name = "systemstd"
path = "tests.rs"

[dependencies]
issuing = "4.1"
rich_rust = {version = "0.2", features = ["markdown", "syntax", "syntect"]}
enum-as-inner = "0.7"
nonempty = "0.12.0"

[dev-dependencies]
criterion = "0.8"
